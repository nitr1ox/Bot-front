services:
  - type: web
    name: botloc
    runtime: static
    buildCommand: echo "pas de build"
    staticPublishPath: .
    routes:
      # Remplace botloc-api.onrender.com par l'adresse réelle de ton backend sur Render
      - type: rewrite
        source: /api/*
        destination: https://botloc-api.onrender.com/api/*
      - type: rewrite
        source: /auth/*
        destination: https://botloc-api.onrender.com/auth/*
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
